<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANKING - CASH DAY</title>
    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.4);
            --border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --green: #52cc5a; 
            --silver: #e2e8f0;
            --bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tv-board {
            width: 1280px;
            height: 720px;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 20px 25px;
            transform-origin: center center;
        }

        /* Header */
        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--v4-red);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--v4-red);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #data-atual {
            font-size: 1.15em;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .brand-tag {
            font-weight: 900;
            font-size: 1.15em;
            color: var(--v4-red);
            letter-spacing: 2px;
        }

        /* Layout Principal dividido (62% Unidades / 38% Regionais) */
        .main-content {
            display: flex;
            flex-grow: 1;
            min-height: 0;
            gap: 25px;
        }

        .col-left {
            flex: 1.6;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            border-left: 1px solid var(--border);
            padding-left: 20px;
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 900;
            color: var(--v4-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- PÓDIO UNIDADES (Esquerda) --- */
        .podium-wrapper-units {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            height: 175px;
        }

        .podium-step-unit {
            background: linear-gradient(180deg, #111111 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 32%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px 10px 12px;
            position: relative;
            text-align: center;
        }

        .podium-step-unit.step-1 { 
            order: 2; 
            height: 165px; 
            border-top: 4px solid var(--v4-red); 
            box-shadow: 0 -15px 35px var(--v4-red-glow);
            z-index: 2;
        }
        
        .podium-step-unit.step-2 { 
            order: 1; 
            height: 142px; 
            border-top: 4px solid var(--silver); 
        }

        .podium-step-unit.step-3 { 
            order: 3; 
            height: 128px; 
            border-top: 4px solid var(--bronze); 
        }

        /* --- PÓDIO REGIONAIS (Direita - Mais alto e fino) --- */
        .podium-wrapper-regionals {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            height: 220px;
        }

        .podium-step-reg {
            background: linear-gradient(180deg, #141414 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 31%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 8px 12px;
            position: relative;
            text-align: center;
        }

        .podium-step-reg.step-1 { 
            order: 2; 
            height: 210px; 
            border-top: 4px solid var(--v4-red); 
            box-shadow: 0 -15px 35px var(--v4-red-glow);
            z-index: 2;
        }
        
        .podium-step-reg.step-2 { 
            order: 1; 
            height: 180px; 
            border-top: 4px solid var(--silver); 
        }

        .podium-step-reg.step-3 { 
            order: 3; 
            height: 160px; 
            border-top: 4px solid var(--bronze); 
        }

        /* Badges e Textos do Pódio */
        .podium-badge {
            position: absolute;
            top: -14px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            font-weight: 900;
            background: #111;
            border: 2px solid;
            color: #fff;
        }
        .step-1 .podium-badge { border-color: var(--v4-red); background: var(--v4-red); top: -18px; width: 38px; height: 38px; font-size: 1.2em; }
        .step-2 .podium-badge { border-color: var(--silver); color: var(--silver); }
        .step-3 .podium-badge { border-color: var(--bronze); color: var(--bronze); }

        .hunter-name {
            font-weight: 800;
            font-size: 0.95em;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .step-1 .hunter-name { font-size: 1.05em; color: var(--v4-red); }

        .podium-pct-box {
            font-size: 1.25em;
            font-weight: 900;
            color: var(--green);
            background: #151515;
            border: 1px solid #222;
            padding: 5px 14px;
            text-align: center;
            width: 90%;
        }
        .step-1 .podium-pct-box { color: #fff; background: var(--v4-red); border-color: var(--v4-red); font-size: 1.4em; }

        /* --- LISTAS COMPACTAS (Sem barra de progresso) --- */
        .ranking-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px; 
            overflow: hidden;
        }

        .ranking-card {
            flex: 0 0 auto; 
            height: 42px;
            background: var(--card-bg);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border: 1px solid var(--border);
            border-left: 3px solid #333;
            transition: transform 0.2s ease;
        }

        .ranking-card:hover {
            border-color: #444;
            transform: translateX(4px);
        }

        .card-left-group {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .badge-rank-list {
            font-size: 0.9em;
            font-weight: 900;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #151515;
            color: var(--text-muted);
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .pct-label-pure {
            font-size: 1.15em;
            font-weight: 900;
            color: var(--green);
            white-space: nowrap;
            text-align: right;
            flex-shrink: 0;
        }

        .error-msg {
            color: var(--v4-red);
            font-weight: 800;
            text-align: center;
            font-size: 0.9em;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div id="tv-board">
        <!-- Header -->
        <div class="header">
            <h1>RANKING - CASH DAY</h1>
            <div class="header-right">
                <span id="data-atual">10/09/2026</span>
                <div class="brand-tag">V4 COMPANY</div>
            </div>
        </div>

        <div class="main-content">
            
            <!-- ESQUERDA: RANKING POR UNIDADE (TOP 10) -->
            <div class="col-left">
                <div class="section-title">UNIDADES</div>
                <div class="podium-wrapper-units" id="units-podium-container"></div>
                <div class="ranking-list" id="units-others-container"></div>
            </div>

            <!-- DIREITA: RANKING POR REGIONAL (PÓDIO MAIS ALTO) -->
            <div class="col-right">
                <div class="section-title">REGIONAL</div>
                <div class="podium-wrapper-regionals" id="regionals-podium-container"></div>
                <div class="ranking-list" id="regionals-others-container"></div>
            </div>

        </div>
    </div>

    <script>
        function autoScaleDashboard() {
            const board = document.getElementById('tv-board');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            board.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', autoScaleDashboard);
        autoScaleDashboard();

        async function fetchAndRenderDashboard() {
            // --- 1. CARREGA UNIDADES (dados.json) ---
            const unitsPodium = document.getElementById('units-podium-container');
            const unitsOthers = document.getElementById('units-others-container');

            try {
                const resUnits = await fetch('./dados.json');
                if (!resUnits.ok) throw new Error("Erro ao carregar dados.json");
                const dataUnits = await resUnits.json();
                const top10Units = dataUnits.slice(0, 10);

                unitsPodium.innerHTML = '';
                unitsOthers.innerHTML = '';

                top10Units.forEach((item, index) => {
                    const rank = index + 1;
                    const nome = item.unidade || item.nome || 'Unidade';
                    const pct = item['%'] || '0,00%';

                    if (rank <= 3) {
                        const step = document.createElement('div');
                        step.className = `podium-step-unit step-${rank}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rank}º</div>
                            <div class="hunter-name" title="${nome}">${nome}</div>
                            <div class="podium-pct-box">${pct}</div>
                        `;
                        unitsPodium.appendChild(step);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="card-left-group">
                                <div class="badge-rank-list">${rank}</div>
                                <div class="hunter-name" style="text-align: left; margin: 0; font-size: 0.95em;" title="${nome}">${nome}</div>
                            </div>
                            <span class="pct-label-pure">${pct}</span>
                        `;
                        unitsOthers.appendChild(card);
                    }
                });

            } catch (err) {
                console.error("Erro Unidades:", err);
                unitsOthers.innerHTML = `<div class="error-msg">Aguardando dados.json...</div>`;
            }

            // --- 2. CARREGA REGIONAIS (dados2.json) ---
            const regPodium = document.getElementById('regionals-podium-container');
            const regOthers = document.getElementById('regionals-others-container');

            try {
                const resReg = await fetch('./dados2.json');
                if (!resReg.ok) throw new Error("Erro ao carregar dados2.json");
                const dataReg = await resReg.json();

                regPodium.innerHTML = '';
                regOthers.innerHTML = '';

                dataReg.forEach((item, index) => {
                    const rank = index + 1;
                    const nome = item.regional || item.unidade || item.nome || 'Regional';
                    const pct = item['%'] || item.realizado || '0,00%';

                    if (rank <= 3) {
                        const step = document.createElement('div');
                        step.className = `podium-step-reg step-${rank}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rank}º</div>
                            <div class="hunter-name" title="${nome}">${nome}</div>
                            <div class="podium-pct-box">${pct}</div>
                        `;
                        regPodium.appendChild(step);
                    } else {
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="card-left-group">
                                <div class="badge-rank-list">${rank}</div>
                                <div class="hunter-name" style="text-align: left; margin: 0; font-size: 0.9em;" title="${nome}">${nome}</div>
                            </div>
                            <span class="pct-label-pure">${pct}</span>
                        `;
                        regOthers.appendChild(card);
                    }
                });

            } catch (err) {
                console.error("Erro Regionais:", err);
                regOthers.innerHTML = `<div class="error-msg">Aguardando dados2.json...</div>`;
            }
        }

        fetchAndRenderDashboard();
    </script>
</body>
</html>
