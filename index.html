<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANKING - CASH DAY</title>
    <style>
        :root {
            --bg: #030303;
            --card-bg: #0a0a0a;
            --v4-red: #ed1c24;
            --v4-red-glow: rgba(237, 28, 36, 0.4);
            --border: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --green: #52cc5a; 
            --silver: #e2e8f0;
            --bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            border-radius: 0px !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tv-board {
            width: 1280px;
            height: 720px;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 25px 35px;
            transform-origin: center center;
        }

        /* Header */
        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--v4-red);
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: var(--v4-red);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #data-atual {
            font-size: 1.2em;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .brand-tag {
            font-weight: 900;
            font-size: 1.2em;
            color: var(--v4-red);
            letter-spacing: 2px;
        }

        /* Layout Principal */
        .main-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            gap: 20px;
        }

        /* Pódio (Top 3) */
        .podium-wrapper {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 25px;
            margin-bottom: 5px;
        }

        .podium-step {
            background: linear-gradient(180deg, #111111 0%, #050505 100%);
            border: 1px solid var(--border);
            width: 32%;
            max-width: 370px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 25px 15px 18px;
            position: relative;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .step-1 { 
            order: 2; 
            height: 195px; 
            border-top: 4px solid var(--v4-red); 
            box-shadow: 0 -15px 40px var(--v4-red-glow);
            z-index: 2;
        }
        
        .step-2 { 
            order: 1; 
            height: 170px; 
            border-top: 4px solid var(--silver); 
        }

        .step-3 { 
            order: 3; 
            height: 155px; 
            border-top: 4px solid var(--bronze); 
        }

        .podium-step:hover { transform: translateY(-3px); }

        .podium-badge {
            position: absolute;
            top: -18px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: 900;
            background: #111;
            border: 2px solid;
            color: #fff;
        }
        .step-1 .podium-badge { border-color: var(--v4-red); background: var(--v4-red); top: -22px; width: 44px; height: 44px; font-size: 1.4em; }
        .step-2 .podium-badge { border-color: var(--silver); color: var(--silver); }
        .step-3 .podium-badge { border-color: var(--bronze); color: var(--bronze); }

        .hunter-name {
            font-weight: 800;
            font-size: 1.05em;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .step-1 .hunter-name { font-size: 1.2em; color: var(--v4-red); }

        .podium-pct-box {
            font-size: 1.4em;
            font-weight: 900;
            color: var(--green);
            background: #151515;
            border: 1px solid #222;
            padding: 6px 22px;
            text-align: center;
        }
        .step-1 .podium-pct-box { color: #fff; background: var(--v4-red); border-color: var(--v4-red); font-size: 1.55em; }

        /* Lista das posições 4 a 10 */
        .ranking-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px; 
            overflow: hidden;
        }

        .ranking-card {
            flex: 0 0 auto; 
            height: 48px;
            background: var(--card-bg);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid var(--border);
            border-left: 3px solid #333;
            transition: transform 0.2s ease;
        }

        .ranking-card:hover {
            border-color: #444;
            transform: translateX(4px);
        }

        .badge-rank-list {
            font-size: 1em;
            font-weight: 900;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #151515;
            color: var(--text-muted);
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .unit-title-container {
            flex: 1;
            min-width: 250px;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1.5;
        }

        .progress-bar-bg {
            background: #1a1a1a;
            height: 7px;
            flex: 1;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--v4-red);
            height: 100%;
        }

        .pct-label-side {
            font-size: 1.15em;
            font-weight: 900;
            color: var(--green);
            white-space: nowrap;
            min-width: 75px;
            text-align: right;
        }

        /* Estilo de erro ao carregar JSON */
        .error-msg {
            color: var(--v4-red);
            font-weight: 800;
            text-align: center;
            font-size: 1.2em;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div id="tv-board">
        <!-- Header -->
        <div class="header">
            <h1>RANKING - CASH DAY</h1>
            <div class="header-right">
                <span id="data-atual">10/09/2026</span>
                <div class="brand-tag">V4 COMPANY</div>
            </div>
        </div>

        <div class="main-content">
            <div class="podium-wrapper" id="podium-container"></div>
            <div class="ranking-list" id="others-container"></div>
        </div>
    </div>

    <script>
        // Ajuste de escala automático para TV / Monitores 16:9
        function autoScaleDashboard() {
            const board = document.getElementById('tv-board');
            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            board.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', autoScaleDashboard);
        autoScaleDashboard();

        // Converte a string de porcentagem (ex: "62,40%") em número float (62.4)
        function parsePct(pctStr) {
            if (!pctStr) return 0;
            return parseFloat(String(pctStr).replace('%', '').replace(',', '.').trim()) || 0;
        }

        // Função principal que busca os dados do dados.json e renderiza o Top 10
        async function fetchAndRenderRanking() {
            const podiumContainer = document.getElementById('podium-container');
            const othersContainer = document.getElementById('others-container');

            try {
                // Puxa o arquivo dados.json que está no repositório do GitHub
                const response = await fetch('./dados.json');
                
                if (!response.ok) {
                    throw new Error(`Erro ao carregar dados.json (${response.status})`);
                }

                const data = await response.json();

                // Filtra para pegar APENAS os 10 primeiros itens do JSON
                const top10 = data.slice(0, 10);

                podiumContainer.innerHTML = '';
                othersContainer.innerHTML = '';

                top10.forEach((item, index) => {
                    const rank = index + 1;
                    const nomeUnidade = item.unidade || 'Unidade';
                    const pctString = item['%'] || '0,00%';
                    const pctFloat = parsePct(pctString);

                    if (rank <= 3) {
                        // Monta o Pódio (1º, 2º e 3º)
                        const step = document.createElement('div');
                        step.className = `podium-step step-${rank}`;
                        step.innerHTML = `
                            <div class="podium-badge">${rank}º</div>
                            <div class="hunter-name" title="${nomeUnidade}">${nomeUnidade}</div>
                            <div class="podium-pct-box">${pctString}</div>
                        `;
                        podiumContainer.appendChild(step);
                    } else {
                        // Monta as posições do 4º ao 10º lugar
                        const card = document.createElement('div');
                        card.className = 'ranking-card';
                        card.innerHTML = `
                            <div class="badge-rank-list">${rank}</div>
                            <div class="unit-title-container">
                                <div class="hunter-name" style="font-size: 0.95em; text-align: left; margin: 0;" title="${nomeUnidade}">${nomeUnidade}</div>
                            </div>
                            <div class="progress-row">
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${Math.min(pctFloat, 100)}%;"></div>
                                </div>
                                <span class="pct-label-side">${pctString}</span>
                            </div>
                        `;
                        othersContainer.appendChild(card);
                    }
                });

            } catch (error) {
                console.error("Erro na integração:", error);
                othersContainer.innerHTML = `<div class="error-msg">Não foi possível carregar o dados.json. Verifique se o arquivo está na raiz do repositório do GitHub.</div>`;
            }
        }

        // Executa a busca assim que a página carregar
        fetchAndRenderRanking();
    </script>
</body>
</html>
