<!DOCTYPE html>
  <html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 Company · Cash Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Kanit:ital,wght@1,900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              bebas: ['"Bebas Neue"', 'sans-serif'],
              sans: ['Inter', 'sans-serif'],
              cashday: ['Kanit', 'sans-serif'],
            },
            colors: {
              v4red: {
                DEFAULT: '#FF0000',
                hover: '#E00000',
                dark: '#8A0000',
                card: '#ED1424',
                glow: 'rgba(255, 0, 0, 0.45)'
              },
              dark: {
                950: '#07080A',
                900: '#0E1015',
                850: '#14171E',
                800: '#1B1F2A',
                750: '#232836',
                700: '#2D3445',
              }
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #07080a;
        color: #f3f4f6;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .font-bebas {
        font-family: 'Bebas Neue', sans-serif;
        letter-spacing: 0.04em;
      }

      .font-cashday {
        font-family: 'Kanit', sans-serif;
        font-style: italic;
        font-weight: 900;
        letter-spacing: 0.02em;
      }

      /* Scrollbar sutil */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #0e1015;
      }
      ::-webkit-scrollbar-thumb {
        background: #232836;
        border-radius: 9999px;
      }

      /* Transição suave nas barras */
      .progress-bar-fill {
        transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Efeitos de brilho e pedestais dinâmicos */
      .podium-gold {
        background: linear-gradient(180deg, rgba(234, 179, 8, 0.16) 0%, rgba(20, 23, 30, 0.98) 100%);
        border: 1px solid rgba(234, 179, 8, 0.55);
        box-shadow: 0 10px 30px -10px rgba(234, 179, 8, 0.35), inset 0 1px 0 rgba(234, 179, 8, 0.4);
      }
      .podium-silver {
        background: linear-gradient(180deg, rgba(203, 213, 225, 0.12) 0%, rgba(20, 23, 30, 0.98) 100%);
        border: 1px solid rgba(203, 213, 225, 0.35);
        box-shadow: 0 10px 25px -10px rgba(203, 213, 225, 0.18), inset 0 1px 0 rgba(203, 213, 225, 0.3);
      }
      .podium-bronze {
        background: linear-gradient(180deg, rgba(217, 119, 6, 0.12) 0%, rgba(20, 23, 30, 0.98) 100%);
        border: 1px solid rgba(217, 119, 6, 0.35);
        box-shadow: 0 10px 25px -10px rgba(217, 119, 6, 0.18), inset 0 1px 0 rgba(217, 119, 6, 0.3);
      }

      /* Textura dinâmica estilo F1 para a barra de progresso */
      .striped-bar {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.15),
          rgba(255, 255, 255, 0.15) 5px,
          transparent 5px,
          transparent 10px
        );
      }

      .glow-red {
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.35);
      }

      /* Grid estilo F1: baia de largada e escalonamento */
      .f1-slot-left {
        transform: translateY(-3px);
        border-left: 3px solid #ED1424;
      }
      .f1-slot-right {
        transform: translateY(3px);
        border-left: 3px solid #4B5563;
      }
      @media (max-width: 768px) {
        .f1-slot-left, .f1-slot-right {
          transform: none;
        }
      }

      /* Suporte garantido para quebra em até 2 linhas */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>

  <body class="min-h-screen w-full flex flex-col justify-center items-center p-2 sm:p-4 lg:p-6 select-none">

    <main class="w-full max-w-5xl bg-dark-900 border border-dark-800 rounded-2xl sm:rounded-3xl p-4 sm:p-5 lg:p-6 shadow-2xl relative flex flex-col justify-between">
      
      <!-- Linha decorativa de topo V4 -->
      <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-transparent via-v4red to-transparent opacity-90"></div>

      <!-- Cabeçalho alinhado na mesma altura: CASH DAY | META | REALIZADO | DELTA | ATINGIMENTO % -->
      <header class="flex flex-col md:flex-row items-stretch justify-between gap-2.5 sm:gap-3 pb-3 mb-1 border-b border-dark-800/80">
        
        <!-- Esquerda: CASH DAY com animação de moedas douradas e nível de preenchimento dinâmico -->
        <div id="cashday-card" class="bg-dark-850 border border-dark-750/70 rounded-xl px-2.5 py-1 sm:px-3 sm:py-1 flex items-center justify-center shrink-0 min-w-[150px] sm:min-w-[195px] overflow-hidden relative group shadow-inner">
          <!-- Canvas dinâmico de líquido dourado e moedas balançando -->
          <canvas id="cashday-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>
          <div class="absolute inset-0 bg-gradient-to-t from-dark-950/60 via-transparent to-transparent pointer-events-none z-[1]"></div>
          
          <h1 class="font-cashday text-3xl sm:text-4xl lg:text-[42px] text-white tracking-wider leading-none text-center select-none w-full italic uppercase drop-shadow-[0_3px_12px_rgba(0,0,0,0.95)] relative z-10">
            CASH DAY
          </h1>
        </div>

        <!-- Centro: Cards mais estreitos (META, REALIZADO e DELTA) -->
        <div class="flex-1 grid grid-cols-3 gap-2 sm:gap-3 items-stretch">
          
          <!-- Card 1: META -->
          <div class="bg-dark-850 border border-dark-750/70 rounded-xl p-2.5 sm:p-3 flex flex-col justify-between">
            <span class="text-[9px] sm:text-[10px] font-bold text-gray-400 uppercase tracking-wider">META</span>
            <div class="mt-0.5">
              <span id="kpi-deveria" class="font-bebas text-lg sm:text-2xl text-white tracking-wide leading-none">R$ 0</span>
            </div>
          </div>

          <!-- Card 2: REALIZADO -->
          <div class="bg-dark-850 border border-dark-750/70 rounded-xl p-2.5 sm:p-3 flex flex-col justify-between">
            <span class="text-[9px] sm:text-[10px] font-bold text-gray-400 uppercase tracking-wider">REALIZADO</span>
            <div class="mt-0.5">
              <span id="kpi-recebido" class="font-bebas text-lg sm:text-2xl text-white tracking-wide leading-none">R$ 0</span>
            </div>
          </div>

          <!-- Card 3: DELTA (Destaque Vermelho) -->
          <div class="bg-v4red rounded-xl p-2.5 sm:p-3 flex flex-col justify-between glow-red shadow-lg">
            <span class="text-[9px] sm:text-[10px] font-bold text-white/95 uppercase tracking-wider">DELTA</span>
            <div class="mt-0.5">
              <span id="kpi-falta" class="font-bebas text-lg sm:text-2xl text-white tracking-wide leading-none">R$ 0</span>
            </div>
          </div>
        </div>

        <!-- Direita: Card estreito de Atingimento % sem setinha -->
        <div class="bg-dark-850 border border-dark-750/70 rounded-xl px-3 py-2 flex flex-col items-center justify-center shrink-0 min-w-[85px] sm:min-w-[105px]">
          <span class="text-[9px] sm:text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">ATING.</span>
          <div id="kpi-atingimento-geral" class="font-bebas text-3xl sm:text-4xl text-v4red leading-none">
            0%
          </div>
        </div>

      </header>

      <section class="flex justify-end items-center pt-1 pb-1">
        <div class="flex items-center gap-2">
          <!-- Toggle: Meta Hoje vs Mês -->
          <div class="inline-flex bg-dark-850 p-0.5 rounded-lg border border-dark-800 text-[11px]">
            <button id="view-hoje" class="px-2.5 py-0.5 rounded-md font-semibold bg-dark-700 text-white transition">
              Hoje
            </button>
            <button id="view-mes" class="px-2.5 py-0.5 rounded-md font-semibold text-gray-400 hover:text-white transition">
              Mês
            </button>
          </div>

          <!-- Botões de ordenação -->
          <div class="inline-flex bg-dark-850 p-0.5 rounded-lg border border-dark-800 text-[11px]">
            <button id="btn-sort-pct" class="px-3 py-0.5 rounded-md font-bold transition bg-v4red text-white">
              % atingido
            </button>
            <button id="btn-sort-falta" class="px-3 py-0.5 rounded-md font-bold transition text-gray-400 hover:text-white">
              Falta trazer
            </button>
          </div>
        </div>
      </section>

      <!-- Pódio Top 3 -->
      <div id="podium-container" class="grid grid-cols-3 gap-2.5 sm:gap-3 items-end my-1.5">
        <!-- O pódio será injetado dinamicamente via JS na ordem: 2º (esquerda), 1º (centro/alto), 3º (direita) -->
      </div>

      <!-- Grid Estilo F1 da 4ª posição em diante (duas colunas escalonadas) -->
      <div class="mt-2 flex flex-col gap-1.5">
        <!-- Container das posições 4 a 13 em formato de grid F1 de 2 colunas com espaço vertical para as tags flutuantes -->
        <div id="f1-grid-container" class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-2.5 items-center pt-1">
          <!-- Injetado dinamicamente via JS com 4 e 5 emparelhados e escalonados -->
        </div>
      </div>
    </main>

    <script>
      const FRANCHISE_MAP = {
        "Sem preenchimento": "V4 Digital & Co.",
        "RS": "V4 Colpo & Co.",
        "MG1": "V4 Albuquerque & Associados",
        "PR": "V4 Prado & Associados",
        "NE": "V4 Salvador Prime",
        "RJ": "V4 Ipanema Growth",
        "SC": "V4 Floripa Tech",
        "Sem Regional": "V4 Expansão & Co.",
        "SP1": "V4 Faria Lima Partners",
        "SP3": "V4 Paulista Growth",
        "MG2": "V4 Savassi & Co.",
        "NUNES": "V4 Nunes & Associados",
        "COLLI": "V4 Colli Partners"
      };

      const FALLBACK_DATA = [
        {"rank":"1","regional":"Sem preenchimento","recebido":"19.792,91","provisionado":"30.237,21","realizado":"65,46%","dif":"10.444,3","meta_hoje":"24.051,09","realizado_hoje":"82,3%","destaque":"V4 Digital & Co."},
        {"rank":"2","regional":"RS","recebido":"1.414.149,54","provisionado":"3.554.010,94","realizado":"39,79%","dif":"2.139.861,4","meta_hoje":"1.590.825,02","realizado_hoje":"88,89%","destaque":"V4 Colpo & Co."},
        {"rank":"3","regional":"MG1","recebido":"1.460.042,88","provisionado":"3.696.155,32","realizado":"39,5%","dif":"2.236.112,44","meta_hoje":"1.661.901,63","realizado_hoje":"87,85%","destaque":"V4 Albuquerque & Associados"},
        {"rank":"4","regional":"PR","recebido":"323.778,98","provisionado":"824.953,15","realizado":"39,25%","dif":"501.174,17","meta_hoje":"325.228,46","realizado_hoje":"99,55%","destaque":"V4 Prado & Associados"},
        {"rank":"5","regional":"NE","recebido":"875.712,93","provisionado":"2.312.098,03","realizado":"37,88%","dif":"1.436.385,1","meta_hoje":"1.136.210,45","realizado_hoje":"77,07%","destaque":"V4 Salvador Prime"},
        {"rank":"6","regional":"RJ","recebido":"738.210,97","provisionado":"2.053.233,62","realizado":"35,95%","dif":"1.315.022,65","meta_hoje":"868.325,61","realizado_hoje":"85,02%","destaque":"V4 Ipanema Growth"},
        {"rank":"7","regional":"SC","recebido":"1.084.345,85","provisionado":"3.135.146,45","realizado":"34,59%","dif":"2.050.800,6","meta_hoje":"1.296.751,9","realizado_hoje":"83,62%","destaque":"V4 Floripa Tech"},
        {"rank":"8","regional":"Sem Regional","recebido":"66.432,68","provisionado":"199.254,38","realizado":"33,34%","dif":"132.821,7","meta_hoje":"136.442,29","realizado_hoje":"48,69%","destaque":"V4 Expansão & Co."},
        {"rank":"9","regional":"SP1","recebido":"1.729.211,34","provisionado":"5.591.684,39","realizado":"30,92%","dif":"3.862.473,05","meta_hoje":"2.415.757,58","realizado_hoje":"71,58%","destaque":"V4 Faria Lima Partners"},
        {"rank":"10","regional":"SP3","recebido":"1.118.782,72","provisionado":"3.758.754,85","realizado":"29,76%","dif":"2.639.972,13","meta_hoje":"1.601.587,44","realizado_hoje":"69,85%","destaque":"V4 Paulista Growth"},
        {"rank":"11","regional":"MG2","recebido":"448.504,15","provisionado":"1.595.799,47","realizado":"28,11%","dif":"1.147.295,32","meta_hoje":"544.767,3","realizado_hoje":"82,33%","destaque":"V4 Savassi & Co."},
        {"rank":"12","regional":"NUNES","recebido":"267.412,75","provisionado":"993.856,33","realizado":"26,91%","dif":"726.443,58","meta_hoje":"398.555,23","realizado_hoje":"67,1%","destaque":"V4 Nunes & Associados"},
        {"rank":"13","regional":"COLLI","recebido":"452.142,86","provisionado":"1.968.745,97","realizado":"22,97%","dif":"1.516.603,11","meta_hoje":"875.840,4","realizado_hoje":"51,62%","destaque":"V4 Colli Partners"}
      ];

      let rawData = [];
      let currentSort = 'pct'; // 'pct' ou 'falta'
      let currentMode = 'hoje'; // 'hoje' ou 'mes'
      let showAll = false;

      function parseBr(val) {
        if (val === undefined || val === null) return 0;
        if (typeof val === 'number') return val;
        const clean = String(val).replace(/\./g, '').replace(',', '.').replace('%', '').trim();
        const num = parseFloat(clean);
        return isNaN(num) ? 0 : num;
      }

      function formatMoney(num) {
        return 'R$ ' + Math.round(num).toLocaleString('pt-BR');
      }

      function formatPct(val) {
        return Math.round(val) + '%';
      }

      function getStatusBadge(pct) {
        if (pct >= 90) {
          return `<span class="text-[10px] font-bold text-emerald-400">Na meta</span>`;
        } else if (pct >= 60) {
          return `<span class="text-[10px] font-bold text-amber-400">Em curso</span>`;
        } else {
          return `<span class="text-[10px] font-bold text-rose-500">Atenção</span>`;
        }
      }

      function renderPodiumCard(item, place) {
        if (!item) return '';

        const isFirst = place === 1;
        const isSecond = place === 2;

        let cardClass = '';
        let badgeBg = '';
        let badgeLabel = '';
        let rankWatermark = '';

        if (isFirst) {
          cardClass = 'podium-gold z-10 sm:-translate-y-1';
          badgeBg = 'bg-yellow-500 text-black shadow-md shadow-yellow-500/30';
          badgeLabel = '1º LUGAR';
          rankWatermark = 'text-yellow-400/[0.12]';
        } else if (isSecond) {
          cardClass = 'podium-silver';
          badgeBg = 'bg-slate-300 text-slate-900';
          badgeLabel = '2º LUGAR';
          rankWatermark = 'text-slate-300/[0.08]';
        } else {
          cardClass = 'podium-bronze';
          badgeBg = 'bg-amber-600 text-white';
          badgeLabel = '3º LUGAR';
          rankWatermark = 'text-amber-500/[0.08]';
        }

        const barWidth = Math.min(100, Math.max(0, item.pctAtingido));

        return `
          <div class="rounded-xl sm:rounded-2xl p-2.5 sm:p-3 flex flex-col justify-between relative overflow-hidden transition-all duration-300 hover:scale-[1.01] ${cardClass}">
            
            <!-- Marca d'água dinâmica no fundo para profundidade -->
            <div class="absolute -right-1 -bottom-4 font-bebas text-7xl sm:text-8xl ${rankWatermark} select-none pointer-events-none leading-none">
              ${place}
            </div>

            <!-- Topo: Franquia na esquerda (centralizada verticalmente), Sigla rigorosamente no centro e % na direita -->
            <div class="relative z-10 min-h-[50px] flex items-center justify-between">
              
              <!-- Canto Esquerdo: Badge e Franquia Destaque com quebra em até 2 linhas e alinhamento vertical centralizado -->
              <div class="flex flex-col items-start justify-center min-w-0 w-[35%] z-10">
                <span class="text-[8px] font-black px-1.5 py-0.5 rounded ${badgeBg} tracking-wider uppercase shrink-0">
                  ${badgeLabel}
                </span>
                <div class="min-h-[28px] flex items-center mt-1">
                  <span class="text-[9px] sm:text-[10px] text-gray-200 font-bold leading-tight line-clamp-2 break-words" title="${item.destaque}">
                    <span class="text-v4red font-black mr-0.5">★</span>${item.destaque}
                  </span>
                </div>
              </div>

              <!-- Meio: Sigla da Regional rigorosamente centralizada no eixo horizontal do card -->
              <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center text-center z-10 pointer-events-none">
                <span class="text-[7px] uppercase tracking-wider text-gray-400 font-semibold block">Regional</span>
                <span class="font-bebas text-2xl sm:text-3xl lg:text-[34px] text-white tracking-wide leading-none">
                  ${item.regional}
                </span>
              </div>

              <!-- Canto Direito: Status e Porcentagem -->
              <div class="text-right flex flex-col items-end justify-center min-w-0 w-[35%] z-10 shrink-0">
                ${getStatusBadge(item.pctAtingido)}
                <span class="font-bebas text-2xl sm:text-3xl leading-none text-white mt-0.5">${formatPct(item.pctAtingido)}</span>
              </div>

            </div>

            <!-- Meio: Dados preenchidos (Realizado vs Meta) eliminando o vazio -->
            <div class="relative z-10 grid grid-cols-2 gap-1 my-1.5 pt-1.5 border-t border-white/10 text-[9px]">
              <div class="bg-dark-900/70 rounded p-1 border border-white/5">
                <span class="text-gray-400 block text-[8px] uppercase font-semibold">Realizado</span>
                <span class="font-bold text-white font-bebas text-xs sm:text-sm tracking-wide">${formatMoney(item.recebido)}</span>
              </div>
              <div class="bg-dark-900/70 rounded p-1 border border-white/5">
                <span class="text-gray-400 block text-[8px] uppercase font-semibold">Meta</span>
                <span class="font-bold text-gray-300 font-bebas text-xs sm:text-sm tracking-wide">${formatMoney(item.metaAlvo)}</span>
              </div>
            </div>

            <!-- Base: Barra com textura e Tag de Delta -->
            <div class="relative z-10 space-y-1">
              <div class="w-full bg-dark-950/80 h-1.5 rounded-full overflow-hidden border border-white/5">
                <div class="h-full bg-v4red rounded-full progress-bar-fill relative" style="width: ${barWidth}%;">
                  <div class="absolute inset-0 striped-bar opacity-35"></div>
                </div>
              </div>

              <div class="flex justify-between items-center text-[9px] bg-dark-950/60 px-1.5 py-0.5 rounded border border-white/5">
                <span class="text-gray-400 uppercase tracking-wider text-[8px] font-semibold">Delta</span>
                <span class="font-black text-rose-400 font-bebas text-[11px] sm:text-xs tracking-wide">
                  ${item.faltaTrazer > 0 ? 'Falta ' + formatMoney(item.faltaTrazer) : 'META ATINGIDA!'}
                </span>
              </div>
            </div>

          </div>
        `;
      }

      function renderF1GridItem(item, rankPos, isLeftColumn) {
        const barWidth = Math.min(100, Math.max(0, item.pctAtingido));
        const staggerClass = isLeftColumn ? 'f1-slot-left' : 'f1-slot-right';

        // Tag de status com o mesmo visual textual do pódio, posicionada no canto superior direito vazando para fora
        let statusTag = '';
        if (item.pctAtingido >= 90) {
          statusTag = `<span class="absolute -top-2.5 right-3 z-20 px-1.5 py-0.5 rounded bg-dark-900 text-[10px] font-bold text-emerald-400 leading-none">Na meta</span>`;
        } else if (item.pctAtingido >= 60) {
          statusTag = `<span class="absolute -top-2.5 right-3 z-20 px-1.5 py-0.5 rounded bg-dark-900 text-[10px] font-bold text-amber-400 leading-none">Em curso</span>`;
        } else {
          statusTag = `<span class="absolute -top-2.5 right-3 z-20 px-1.5 py-0.5 rounded bg-dark-900 text-[10px] font-bold text-rose-500 leading-none">Atenção</span>`;
        }

        return `
          <div class="bg-dark-850 hover:bg-dark-800 border border-dark-800/80 rounded-xl p-1.5 sm:p-2 transition-all flex flex-col gap-1 relative ${staggerClass}">
            
            <!-- Tag de Status Minimalista -->
            ${statusTag}

            <div class="flex items-center justify-between gap-1.5 min-w-0">
              
              <!-- Bloco 1: Rank + Regional + Nome do Destaque -->
              <div class="flex items-center gap-1.5 min-w-0 flex-1">
                <div class="w-4 h-4 rounded-full bg-dark-750 text-gray-300 flex items-center justify-center font-bold text-[9px] shrink-0">
                  ${rankPos}
                </div>
                <span class="font-extrabold text-white text-xs tracking-tight shrink-0">${item.regional}</span>
                
                <!-- Nome do Destaque entre o status e os valores -->
                <span class="text-[10px] text-gray-300 truncate font-semibold flex items-center gap-0.5 min-w-0" title="${item.destaque}">
                  <span class="text-v4red text-[9px]">★</span>
                  <span class="truncate">${item.destaque}</span>
                </span>
              </div>

              <!-- Bloco 2: Apenas [Recebido] / [Meta] e a % -->
              <div class="flex items-center gap-2 shrink-0 text-right pr-0.5">
                <div class="text-[11px] text-gray-300 flex items-center gap-1 font-bebas tracking-wide">
                  <span class="text-white text-xs sm:text-sm">${formatMoney(item.recebido)}</span>
                  <span class="text-gray-500 font-sans text-[10px]">/</span>
                  <span class="text-gray-400 text-xs sm:text-sm">${formatMoney(item.metaAlvo)}</span>
                </div>
                <div class="text-right pl-1.5 border-l border-dark-750">
                  <span class="font-bebas text-xs sm:text-sm font-bold text-white tracking-wide">${formatPct(item.pctAtingido)}</span>
                </div>
              </div>

            </div>

            <!-- Barra de Progresso Fina -->
            <div class="w-full bg-dark-700/80 h-1 rounded-full overflow-hidden">
              <div class="h-full bg-v4red rounded-full progress-bar-fill" style="width: ${barWidth}%;"></div>
            </div>
          </div>
        `;
      }

      function renderDashboard() {
        if (!rawData || rawData.length === 0) return;

        const items = rawData.map(item => {
          const recebido = parseBr(item.recebido);
          const metaHoje = parseBr(item.meta_hoje);
          const provisionado = parseBr(item.provisionado);
          
          const metaAlvo = currentMode === 'hoje' ? metaHoje : provisionado;
          const pctAtingido = metaAlvo > 0 ? (recebido / metaAlvo) * 100 : 0;
          const faltaTrazer = Math.max(0, metaAlvo - recebido);

          const regionalName = item.regional || 'Sem Nome';
          const destaque = item.destaque || item.franchise_destaque || item.franquia || FRANCHISE_MAP[regionalName] || 'V4 Franchising';

          return {
            regional: regionalName,
            destaque,
            recebido,
            metaAlvo,
            pctAtingido,
            faltaTrazer
          };
        });

        // Totais gerais
        const totalRecebido = items.reduce((acc, curr) => acc + curr.recebido, 0);
        const totalMeta = items.reduce((acc, curr) => acc + curr.metaAlvo, 0);
        const totalFalta = Math.max(0, totalMeta - totalRecebido);
        const totalAtingimento = totalMeta > 0 ? (totalRecebido / totalMeta) * 100 : 0;

        // Atualizar Cards Globais
        document.getElementById('kpi-deveria').innerText = formatMoney(totalMeta);
        document.getElementById('kpi-recebido').innerText = formatMoney(totalRecebido);
        document.getElementById('kpi-falta').innerText = formatMoney(totalFalta);
        document.getElementById('kpi-atingimento-geral').innerText = formatPct(totalAtingimento);

        // Atualiza a meta de preenchimento de moedas no logo CASH DAY
        setCashDayTargetPct(totalAtingimento);

        // Ordenar lista
        if (currentSort === 'pct') {
          items.sort((a, b) => b.pctAtingido - a.pctAtingido);
        } else {
          items.sort((a, b) => b.faltaTrazer - a.faltaTrazer);
        }

        // 1. Renderizar PÓDIO (2º na esquerda, 1º no centro, 3º na direita)
        const podiumContainer = document.getElementById('podium-container');
        const first = items[0];
        const second = items[1];
        const third = items[2];

        podiumContainer.innerHTML = `
          ${renderPodiumCard(second, 2)}
          ${renderPodiumCard(first, 1)}
          ${renderPodiumCard(third, 3)}
        `;

        // 2. Renderizar GRID F1 (da 4ª posição em diante, em pares 4-5, 6-7, etc.)
        const gridContainer = document.getElementById('f1-grid-container');
        gridContainer.innerHTML = '';

        const gridRacers = items.slice(3); // Posições 4 em diante
        gridRacers.forEach((item, idx) => {
          const rankPos = idx + 4;
          const isLeftColumn = idx % 2 === 0; // Pares da lista (4º, 6º, 8º, etc. ficam à esquerda)
          gridContainer.innerHTML += renderF1GridItem(item, rankPos, isLeftColumn);
        });
      }

      let targetCashDayPct = 0;
      let currentCashDayPct = 0;
      let animState = 'idle'; // 'filling', 'draining', 'idle'

      function setCashDayTargetPct(pct) {
        const newTarget = Math.min(100, Math.max(0, pct));
        if (Math.abs(newTarget - targetCashDayPct) > 0.5) {
          if (newTarget > currentCashDayPct) {
            animState = 'filling';
          } else if (newTarget < currentCashDayPct) {
            animState = 'draining';
          }
        }
        targetCashDayPct = newTarget;
      }

      function initCashDayCoinsAnimation() {
        const canvas = document.getElementById('cashday-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const parent = document.getElementById('cashday-card');

        let width = 0;
        let height = 0;
        let dpr = 1;

        function resize() {
          if (!parent) return;
          dpr = window.devicePixelRatio || 1;
          width = parent.clientWidth;
          height = parent.clientHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          generateStaticPile();
        }

        window.addEventListener('resize', resize);

        // Estrutura das moedas estáticas na pilha (estilo montanha de ouro do Tio Patinhas)
        let staticPileCoins = [];
        const PILE_COIN_COUNT = 320;

        function generateStaticPile() {
          staticPileCoins = [];
          for (let i = 0; i < PILE_COIN_COUNT; i++) {
            // Distribuição que cria montículos naturais de moedas sobrepostas
            const relX = 0.02 + Math.random() * 0.96;
            // Altura relativa dentro do card (0 = fundo, 100 = topo total)
            const levelPct = Math.pow(Math.random(), 1.15) * 100;
            const rx = 5.5 + Math.random() * 4.2;
            const ry = rx * (0.42 + Math.random() * 0.16);
            const tilt = (Math.random() - 0.5) * 0.35;
            const thickness = 1.6 + Math.random() * 1.5;
            const goldVariant = Math.floor(Math.random() * 3);

            staticPileCoins.push({
              relX,
              levelPct,
              rx,
              ry,
              tilt,
              thickness,
              goldVariant,
              sparkleDelay: Math.floor(Math.random() * 120),
              sparkleLife: 0
            });
          }
          // Ordena as moedas para renderizar as mais baixas primeiro (profundidade)
          staticPileCoins.sort((a, b) => a.levelPct - b.levelPct);
        }

        // Partículas ativas para transição (queda ao encher ou drenagem ao esvaziar)
        const dynamicCoins = [];
        const sparkles = [];

        function spawnFallingCoin() {
          dynamicCoins.push({
            x: Math.random() * width,
            y: -15 - Math.random() * 25,
            vx: (Math.random() - 0.5) * 1.5,
            vy: 3.5 + Math.random() * 4.5,
            rx: 6 + Math.random() * 3.5,
            ry: 3 + Math.random() * 2,
            rot: Math.random() * Math.PI,
            vRot: 0.12 + Math.random() * 0.18,
            type: 'falling',
            thickness: 2
          });
        }

        function spawnDrainingCoin(startY) {
          dynamicCoins.push({
            x: (width * 0.2) + Math.random() * (width * 0.6),
            y: startY + Math.random() * 15,
            vx: (Math.random() - 0.5) * 2.2,
            vy: 4 + Math.random() * 5.5,
            rx: 6 + Math.random() * 3,
            ry: 3 + Math.random() * 1.8,
            rot: Math.random() * Math.PI,
            vRot: 0.15 + Math.random() * 0.25,
            type: 'draining',
            thickness: 2
          });
        }

        function spawnSparkle(x, y, size) {
          sparkles.push({
            x,
            y,
            size: size || (6 + Math.random() * 5),
            life: 1.0,
            decay: 0.04 + Math.random() * 0.03
          });
        }

        // Desenha uma moeda individual com contorno escuro e gradiente de ouro (estilo quadrinhos Disney)
        function drawCartoonCoin(x, y, rx, ry, tilt, thickness, variant, rotCos) {
          ctx.save();
          ctx.translate(x, y);
          if (tilt) ctx.rotate(tilt);
          if (rotCos !== undefined) ctx.scale(rotCos, 1);

          const th = thickness || 2;

          // 1. Borda/Espessura 3D da moeda (cilindro inferior)
          ctx.beginPath();
          ctx.ellipse(0, th, rx, ry, 0, 0, Math.PI);
          ctx.lineTo(-rx, 0);
          ctx.ellipse(0, 0, rx, ry, 0, Math.PI, 0, true);
          ctx.lineTo(rx, th);
          ctx.closePath();
          ctx.fillStyle = variant === 0 ? '#B45309' : (variant === 1 ? '#92400E' : '#78350F');
          ctx.fill();
          ctx.strokeStyle = '#3D1A04';
          ctx.lineWidth = 0.75;
          ctx.stroke();

          // 2. Face superior da moeda
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          const grad = ctx.createLinearGradient(-rx, -ry, rx, ry);
          if (variant === 0) {
            grad.addColorStop(0, '#FEF08A');
            grad.addColorStop(0.35, '#FACC15');
            grad.addColorStop(0.75, '#EAB308');
            grad.addColorStop(1, '#CA8A04');
          } else if (variant === 1) {
            grad.addColorStop(0, '#FFFBEB');
            grad.addColorStop(0.4, '#FDE047');
            grad.addColorStop(0.8, '#F59E0B');
            grad.addColorStop(1, '#B45309');
          } else {
            grad.addColorStop(0, '#FEF9C3');
            grad.addColorStop(0.35, '#FBBF24');
            grad.addColorStop(0.8, '#D97706');
            grad.addColorStop(1, '#92400E');
          }
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.strokeStyle = '#451A03';
          ctx.lineWidth = 0.8;
          ctx.stroke();

          // 3. Relevo interno (anel entalhado de moeda de ouro)
          if (rx > 3.5 && (rotCos === undefined || Math.abs(rotCos) > 0.4)) {
            ctx.beginPath();
            ctx.ellipse(0, 0, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(202, 138, 4, 0.65)';
            ctx.lineWidth = 0.55;
            ctx.stroke();

            // Ponto central de brilho
            ctx.beginPath();
            ctx.arc(0, 0, 0.7, 0, Math.PI * 2);
            ctx.fillStyle = '#FEF08A';
            ctx.fill();
          }

          ctx.restore();
        }

        // Desenha brilho estrelado (sparkle de 4 pontas clássico dos quadrinhos do Tio Patinhas)
        function drawSparkleStar(x, y, size, alpha) {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.quadraticCurveTo(0, 0, size, 0);
          ctx.quadraticCurveTo(0, 0, 0, size);
          ctx.quadraticCurveTo(0, 0, -size, 0);
          ctx.quadraticCurveTo(0, 0, 0, -size);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.arc(0, 0, size * 0.28, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(254, 240, 138, ${alpha})`;
          ctx.fill();
          ctx.restore();
        }

        let idleSparkleTimer = 0;

        function animate() {
          ctx.clearRect(0, 0, width, height);

          // Transição suave de nível quando houver mudança de aba (Hoje vs Mês)
          const diff = targetCashDayPct - currentCashDayPct;
          if (Math.abs(diff) > 0.3) {
            if (diff > 0) {
              // ENCHENDO: moedas caindo do topo até alcançar o nível correto
              currentCashDayPct += Math.min(diff * 0.08 + 0.35, 1.8);
              animState = 'filling';
              if (Math.random() < 0.8) {
                spawnFallingCoin();
                spawnFallingCoin();
              }
            } else {
              // DRENAGEM: nível baixando e moedas escoando pelo fundo
              currentCashDayPct += Math.max(diff * 0.08 - 0.35, -1.8);
              animState = 'draining';
              const pileSurfaceY = height - (currentCashDayPct / 100) * height;
              if (Math.random() < 0.75) {
                spawnDrainingCoin(pileSurfaceY);
                spawnDrainingCoin(height - 15);
              }
            }
          } else {
            currentCashDayPct = targetCashDayPct;
            animState = 'idle';
          }

          const fillHeight = (currentCashDayPct / 100) * height;

          if (fillHeight > 2) {
            const surfaceY = height - fillHeight;

            // Fundo dourado compacto na base da pilha para preencher vazios entre as moedas
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, surfaceY + 4);
            ctx.lineTo(width, surfaceY + 4);
            ctx.lineTo(width, height);
            ctx.closePath();
            const baseGrad = ctx.createLinearGradient(0, surfaceY, 0, height);
            baseGrad.addColorStop(0, '#B45309');
            baseGrad.addColorStop(0.3, '#92400E');
            baseGrad.addColorStop(1, '#451A03');
            ctx.fillStyle = baseGrad;
            ctx.fill();
            ctx.restore();

            // 1. Renderiza a montanha estática de moedas visíveis até a altura do percentual atual
            staticPileCoins.forEach(coin => {
              if (coin.levelPct <= currentCashDayPct) {
                const coinY = height - (coin.levelPct / 100) * height;
                const coinX = coin.relX * width;
                drawCartoonCoin(coinX, coinY, coin.rx, coin.ry, coin.tilt, coin.thickness, coin.goldVariant);

                // Brilhos pontuais na superfície em repouso
                if (animState === 'idle') {
                  coin.sparkleDelay--;
                  if (coin.sparkleDelay <= 0 && coin.levelPct >= (currentCashDayPct - 18)) {
                    coin.sparkleLife = 1.0;
                    coin.sparkleDelay = 180 + Math.floor(Math.random() * 250);
                  }
                  if (coin.sparkleLife > 0) {
                    drawSparkleStar(coinX, coinY - coin.ry * 0.5, 4.5, coin.sparkleLife);
                    coin.sparkleLife -= 0.04;
                  }
                }
              }
            });

            // Sparkle ocasional espontâneo no topo em repouso
            if (animState === 'idle') {
              idleSparkleTimer++;
              if (idleSparkleTimer > 50) {
                idleSparkleTimer = 0;
                const rx = 15 + Math.random() * (width - 30);
                const ry = surfaceY + Math.random() * 8;
                spawnSparkle(rx, ry, 5 + Math.random() * 4);
              }
            }
          }

          // 2. Atualiza e desenha moedas dinâmicas (chuva de moedas ou drenagem)
          for (let i = dynamicCoins.length - 1; i >= 0; i--) {
            const p = dynamicCoins[i];
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vRot;

            const rotCos = Math.cos(p.rot);
            drawCartoonCoin(p.x, p.y, p.rx, p.ry, 0, p.thickness, 0, rotCos);

            const surfaceY = height - (currentCashDayPct / 100) * height;

            if (p.type === 'falling') {
              // Atingiu a superfície da pilha
              if (p.y >= surfaceY) {
                spawnSparkle(p.x, surfaceY, 6);
                dynamicCoins.splice(i, 1);
              }
            } else if (p.type === 'draining') {
              // Passou do fundo do card
              if (p.y > height + 25) {
                dynamicCoins.splice(i, 1);
              }
            }
          }

          // 3. Atualiza e desenha brilhos/sparkles
          for (let i = sparkles.length - 1; i >= 0; i--) {
            const s = sparkles[i];
            drawSparkleStar(s.x, s.y, s.size, s.life);
            s.life -= s.decay;
            if (s.life <= 0) sparkles.splice(i, 1);
          }

          requestAnimationFrame(animate);
        }

        resize();
        animate();
      }

      function updateControlsUI() {
        const btnSortPct = document.getElementById('btn-sort-pct');
        const btnSortFalta = document.getElementById('btn-sort-falta');

        if (currentSort === 'pct') {
          btnSortPct.className = "px-3 py-1 rounded-md font-bold transition bg-v4red text-white shadow";
          btnSortFalta.className = "px-3 py-1 rounded-md font-bold transition text-gray-400 hover:text-white";
        } else {
          btnSortFalta.className = "px-3 py-1 rounded-md font-bold transition bg-v4red text-white shadow";
          btnSortPct.className = "px-3 py-1 rounded-md font-bold transition text-gray-400 hover:text-white";
        }

        const btnViewHoje = document.getElementById('view-hoje');
        const btnViewMes = document.getElementById('view-mes');

        if (currentMode === 'hoje') {
          btnViewHoje.className = "px-2.5 py-1 rounded-md font-semibold bg-dark-700 text-white transition";
          btnViewMes.className = "px-2.5 py-1 rounded-md font-semibold text-gray-400 hover:text-white transition";
        } else {
          btnViewMes.className = "px-2.5 py-1 rounded-md font-semibold bg-dark-700 text-white transition";
          btnViewHoje.className = "px-2.5 py-1 rounded-md font-semibold text-gray-400 hover:text-white transition";
        }
      }

      async function loadData() {
        const statusEl = document.getElementById('data-source-status');
        try {
          const res = await fetch('./dados.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('dados.json não encontrado');
          
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            rawData = json;
            if (statusEl) statusEl.innerText = '(carregado de dados.json)';
          } else {
            throw new Error('Formato inválido');
          }
        } catch (err) {
          console.warn('Utilizando dados fallback:', err.message);
          rawData = FALLBACK_DATA;
          if (statusEl) statusEl.innerText = '(dados embutidos)';
        }

        renderDashboard();
      }

      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btn-sort-pct').addEventListener('click', () => {
          currentSort = 'pct';
          updateControlsUI();
          renderDashboard();
        });

        document.getElementById('btn-sort-falta').addEventListener('click', () => {
          currentSort = 'falta';
          updateControlsUI();
          renderDashboard();
        });

        document.getElementById('view-hoje').addEventListener('click', () => {
          currentMode = 'hoje';
          updateControlsUI();
          renderDashboard();
        });

        document.getElementById('view-mes').addEventListener('click', () => {
          currentMode = 'mes';
          updateControlsUI();
          renderDashboard();
        });

        initCashDayCoinsAnimation();
        loadData();
      });
    </script>
  </body>
  </html>
